<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cartão Interativo</title>
    
    <!-- Vinculando o CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <h1 id="titulo">Bem-vindo(a)!</h1>
        <p id="descricao">Digite seu nome para personalizar a página:</p>

        <div class="grupo-input">
            <input type="text" id="campo-nome" placeholder="Digite seu nome...">
            <button id="btn-atualizar">Salvar</button>
        </div>

        <div class="secao-contador">
            <p>Contador de cliques: <strong id="contador">0</strong></p>
            <button id="btn-incrementar">Clique Aqui</button>
        </div>
    </main>

    <!-- Vinculando o JavaScript externo antes de fechar o body -->
    <script src="script.js"></script>
</body>
</html>
